<!DOCTYPE html>
<html>
<head>
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    #container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    #image1, #image2 {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    #image2 {
        opacity: 0;
        transition: opacity 1s;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="container">

    <img id="image1"
         src="https://www.shutterstock.com/image-photo/annoyed-lady-making-stop-gesture-600w-2427465543.jpg">

    <img id="image2"
         src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Teagan_Micah%2C_UCLA_goalkeeper.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original">

</div>

<script>
    let timer;

    document.getElementById("container").addEventListener("mouseenter", function() {

        timer = setTimeout(function() {
            document.getElementById("image2").style.opacity = "1";
        }, 5000);

    });
</script>

</body>
</html>
