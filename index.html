<!DOCTYPE html>
<html>
<head>

<style>
    html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    }
    
    #container {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
    }
    
    #image1, #image2 {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    #image2 {
        opacity: 0;
        transition: opacity 3s;
    }
</style>

</head>

<body>

<div id="container">

    <img id="image1"
         src="https://www.shutterstock.com/image-photo/annoyed-lady-making-stop-gesture-600w-2427465543.jpg">

    <img id="image2"
         src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Teagan_Micah%2C_UCLA_goalkeeper.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original">

</div>

<script>

let activated = false;
let timer;

const container = document.getElementById("container");
const image1 = document.getElementById("image1");
const image2 = document.getElementById("image2");

container.addEventListener("mouseenter", function() {

    if (activated) return;

    timer = setTimeout(function() {

        activated = true;

        image2.style.opacity = "1";

        setTimeout(function() {
            image1.remove();
        }, 3000);

    }, 5000);

});

container.addEventListener("mouseleave", function() {

    if (activated) return;

    clearTimeout(timer);

});

</script>

</body>
</html>
