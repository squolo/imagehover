<!DOCTYPE html>
<html>
<body style="margin:0;">

<div style="position:relative; width:500px;">

    <img src="https://www.shutterstock.com/image-photo/annoyed-lady-making-stop-gesture-600w-2427465543.jpg"
         style="width:100%; display:block;">

    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Teagan_Micah%2C_UCLA_goalkeeper.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
         style="
            position:absolute;
            top:0;
            left:0;
            width:100%;
            opacity:0;
            pointer-events:none;
         ">

</div>

<style>
div:hover img + img {
    animation: fadein 1s 5s forwards;
}

@keyframes fadein {
    from { opacity:0; }
    to { opacity:1; }
}
</style>

</body>
</html>
